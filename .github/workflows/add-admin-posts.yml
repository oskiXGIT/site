name: Add live admin posts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-admin-posts.yml

permissions:
  contents: write

jobs:
  build-posts-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: python .github/scripts/add_admin_posts.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add live admin-managed posts"
          git push
