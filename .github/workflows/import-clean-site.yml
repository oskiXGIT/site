name: Import clean site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy current clean site files
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/oskiXGIT/oskixgit.github.io/main"
          files=(
            ads.css
            ads.js
            background.mp4
            chief.png
            features.css
            features.js
            gang.css
            gang.js
            index.html
            language-onboarding.js
            language-ui.css
            languages-extra.js
            script.js
            style.css
          )
          for f in "${files[@]}"; do
            curl -fsSL "$base/$f" -o "$f"
          done
          rm -f CNAME privacy-test.txt
          rm -f .github/workflows/import-clean-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit clean site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import clean current site"
          git push
