name: Patch automatic translations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-auto-translate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch automatic translations
        run: python .github/patch-auto-translate.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add slang-aware automatic translations"
          git push
