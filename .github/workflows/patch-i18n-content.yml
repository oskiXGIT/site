name: Patch multilingual content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-i18n-content.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch multilingual content
        run: python .github/patch_i18n_content.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make posts and archives multilingual"
          git push
